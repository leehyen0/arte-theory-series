name: External custodian identity-independence review
on:
  issue_comment:
    types: [created]

jobs:
  process-review:
    if: >-
      github.event.issue.number == 10 &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild registration and evidence-review state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python external-custodian-challenge/process_identity_independence_review.py \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --output-dir /tmp/arte-identity-independence-review \
            --post-response
      - uses: actions/upload-artifact@v4
        with:
          name: identity-independence-review-${{ github.event.comment.id }}
          path: |
            /tmp/arte-identity-independence-review/review_receipt.json
            /tmp/arte-identity-independence-review/registration_registry.json
            /tmp/arte-identity-independence-review/promotion_state.json
            /tmp/arte-identity-independence-review/verified_custodian_registry.json
            /tmp/arte-identity-independence-review/review_response.md

# Evidence-reviewed quorum is protocol-level only.
# It does not establish legal identity, absolute human uniqueness, absolute independence,
# independent evaluation, external success, promotion, AGI or ASI.
