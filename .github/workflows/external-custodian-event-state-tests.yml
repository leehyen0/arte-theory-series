name: External custodian event-state tests
on:
  pull_request:
  workflow_dispatch:

jobs:
  test-state-machine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Run fail-closed event-state and processor tests
        working-directory: external-custodian-challenge
        run: |
          python -m pytest -q \
            test_external_custodian_event_state.py \
            test_process_custodian_event_comment.py
      - name: Rebuild live evidence-reviewed authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python external-custodian-challenge/build_live_verified_registry.py \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --output /tmp/live-registry.json \
            --state-output /tmp/live-promotion-state.json
      - name: Validate event state against the same live registry used in production
        working-directory: external-custodian-challenge
        run: |
          python - <<'PY'
          import json
          import external_custodian_event_state as sm
          registry=json.load(open('/tmp/live-registry.json'))
          problems=sm.validate_verified_registry(registry)
          state=sm.build_state(registry=registry,comments=[],predictor_login='leehyen0')
          assert problems == []
          assert state['phase'] == 'WAITING_FOR_VERIFIED_EXTERNAL_QUORUM'
          assert state['verified_external_quorum'] is False
          assert state['external_success'] is False
          assert state['promotion'] is False
          print('LIVE_EVENT_STATE_FAIL_CLOSED=true')
          print('registry_hash='+registry['registry_hash'])
          print('event_state_hash='+state['state_hash'])
          PY

# Production authority is rebuilt from issue #3 registration and issue #10 evidence review.
# The static registry is no longer trusted by the event workflow as live authority.
# No legal identity, absolute independence, external success, promotion, AGI or ASI is inferred.
